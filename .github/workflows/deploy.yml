name: Deploy CRM

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test functions
        run: cd functions && npm ci && npm test

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firebase resources
        run: npx firebase-tools@15.14.0 deploy --only functions:crm,firestore:odorik,hosting --project odorik-tx-260720-c58d --force
