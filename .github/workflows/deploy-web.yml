name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The locale is baked in at build time and written to .output-<locale>,
      # which firebase.json maps to a hosting site. Only Czech is live today;
      # an English site would add its own build step and target here.
      - name: Build CZ
        run: DEFAULT_LOCALE=cs npx nuxi generate

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # firebase.json lives at the repo root, and `hosting:web` scopes the
      # deploy to the marketing site so the app's `frontend` target is untouched.
      - name: Deploy to Firebase Hosting
        working-directory: .
        run: npx firebase-tools@15.14.0 deploy --only hosting:web --project odorik-tx-260720-c58d --force
