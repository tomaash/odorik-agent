<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Agent Erik</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
      }
      .app-boot {
        align-items: center;
        background: #f4f2ee;
        color: #1d1c1a;
        display: flex;
        flex-direction: column;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        gap: 1rem;
        justify-content: center;
        min-height: 100vh;
      }
      .app-boot__mark {
        align-items: center;
        background: #151515;
        border-radius: .5rem;
        color: #fff;
        display: flex;
        font-size: 1.35rem;
        font-weight: 750;
        height: 3.75rem;
        justify-content: center;
        letter-spacing: -.04em;
        width: 3.75rem;
      }
      .app-boot__spinner {
        animation: app-boot-spin .8s linear infinite;
        border: 3px solid rgba(53, 79, 216, .14);
        border-radius: 999px;
        border-top-color: #354fd8;
        height: 1.5rem;
        width: 1.5rem;
      }
      .app-boot__label {
        color: #68645e;
        font-size: .875rem;
        font-weight: 600;
        margin: 0;
      }
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot__spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="app-boot" role="status" aria-live="polite">
        <div class="app-boot__mark" aria-hidden="true">E</div>
        <div class="app-boot__spinner" aria-hidden="true"></div>
        <p class="app-boot__label">Načítám Agent Erik…</p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
